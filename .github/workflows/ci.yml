name: CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-train.txt
      - name: Install training-runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train.txt
      - name: Verify standalone training runtime
        run: |
          python -c "import model, pretrain.data, pretrain.train, pretrain.tokenizer_identity; from tokenizers import Tokenizer"
          python scripts/launch_pretraining.py --help >/dev/null
      - name: Install data-pipeline dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Compile Python sources
        run: python -m compileall -q model.py pretrain posttrain environments scripts tests
      - name: Run full CPU suite
        run: python -m unittest discover -s tests
