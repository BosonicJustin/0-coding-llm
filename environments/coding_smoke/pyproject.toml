[project]
name = "coding-smoke"
version = "0.1.0"
description = "Leakage-safe synthetic Python coding smoke tasks for Prime Verifiers v1."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_smoke"]
